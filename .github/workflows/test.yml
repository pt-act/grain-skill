name: grain self-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: browser-actions/setup-chrome@v4
        with:
          chrome-version: stable

      - name: Run the grain self-test
        run: bash skills/grain/tests/run.sh
