name: grain self-test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - name: Lint the examples
        run: node skills/grain/scripts/lint.mjs examples

      - name: Check llms.txt is in sync
        run: node scripts/llms.mjs --check

      - name: Run the grain self-test
        env:
          GRAIN_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: bash skills/grain/tests/run.sh
